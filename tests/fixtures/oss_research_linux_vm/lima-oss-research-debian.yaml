# #78 Linux VM 조사 워커 — Debian 13 게스트 변형(인스턴스 이름 oss-research-debian).
# 이미지 절만 lima-oss-research.yaml 과 다르다. provision 스크립트는 같아야 한다.
#
# 상태: 2026-09-28 $HOME/.oss-research-vm 에서 limactl validate·create·start 와 비AI preflight 를
#       실행했다(결과: docs/research/2026-09-28-78-linux-vm-bootstrap.md 「실행 결과」). 모델·인증·실제 OSS 조회는 하지 않았다.
# 기준: Lima v2.2.0 (tag 867a713, 서명 검증됨) templates/default.yaml 의 키.
# 설명: docs/research/2026-09-28-78-linux-vm-bootstrap.md
#
# 원칙: 기본 템플릿(template:default)과 `base` 를 쓰지 않는다.
# default 템플릿은 base 로 `template:_default/mounts`(호스트 홈 읽기 전용 마운트)를
# 상속하기 때문이다. 필요한 키를 전부 이 파일에 직접 적는다.

minimumLimaVersion: 2.2.0

vmType: vz
arch: aarch64
os: Linux

# Debian 13 (trixie) genericcloud arm64. URL·digest는 Lima v2.2.0
# templates/_images/debian-13.yaml 의 genericcloud 항목과 같고,
# Debian 공식 SHA512SUMS(20260712-2537)와도 일치했다(2026-09-28 확인).
# Ubuntu 24.04 에서 AppArmor unprivileged_userns 가 bwrap 을 막아 배포판 호환성 시험용으로 둔다.
images:
- location: "https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2"
  arch: "aarch64"
  digest: "sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed"
  variant: "genericcloud"

# 비AI 격리 시험 기준 최소 자원. disk는 상한이며 호스트에서는 sparse로 잡힌다.
cpus: 2
memory: "2GiB"
disk: "16GiB"

# plain 모드: 마운트, 동적 포트 포워딩, 내장 containerd, guest agent,
# rosetta, SSH agent 포워딩, 호스트 시계 동기화가 꺼진다(docs/config/plain.md).
# guest agent 가 없으므로 GHSA-2j9v-p4xj-cjw2 계열(게스트 사용자 → agent socket)
# 표면도 사라진다. 아래 개별 키는 plain 과 같은 방향으로 한 번 더 적어 둔 것이다.
plain: true

# 호스트 디렉터리를 하나도 노출하지 않는다.
mounts: []

# 모든 게스트 포트를 호스트로 넘기지 않는다. plain 모드에서는 static 이 아닌
# 규칙이 무시되므로 이 규칙도 무시되지만, plain 을 끄는 실수에 대한 두 번째 선이다.
portForwards:
- guestIP: "0.0.0.0"
  guestIPMustBeZero: false
  proto: any
  guestPortRange: [1, 65535]
  ignore: true

ssh:
  # 호스트 127.0.0.1 의 임의 빈 포트 → 게스트 22. 외부 인터페이스에는 열지 않는다.
  localPort: 0
  # ~/.ssh/*.pub 을 게스트에 넣지 않는다. 키는 $LIMA_HOME/_config/user 만 쓴다.
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false

containerd:
  system: false
  user: false

# limactl 을 실행한 셸의 http(s)_proxy 등을 게스트로 옮기지 않는다.
propagateProxyEnv: false

upgradePackages: false
nestedVirtualization: false
timezone: "UTC"

# 게스트 관리 계정. Lima 가 만들고 passwordless sudo 를 가진다.
# 조사 프로세스는 이 계정으로 실행하지 않는다(아래 provision 의 ossresearch).
# uid·comment 를 명시하지 않으면 호스트 uid·실명이 들어간다.
user:
  name: "vmadmin"
  comment: "oss-research vm admin"
  uid: 1500
  home: "/home/vmadmin"
  shell: "/bin/bash"
  passwordlessSudo: true

# root 로 실행되며 재기동 때 다시 실행될 수 있다(default.yaml 주석). 그래서 멱등으로 쓴다.
# 첫 기동의 이 단계에서만 apt 가 외부망을 쓴다. 규칙 적용 뒤 조사 사용자는 lo 외 송신과 DNS(lo 포함)가
# 막히고, systemd-resolved 의 송신도 막혀 게스트 전체 DNS 가 끊긴다.
# 패키지 버전 고정(snapshot.ubuntu.com)은 후속 bootstrap Task 에서 정한다.
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eu -o pipefail
    export DEBIAN_FRONTEND=noninteractive

    # 1) 조사 전용 사용자: sudo·adm·systemd-journal 그룹 없음, SSH 키 없음, 비밀번호 잠금.
    if ! id ossresearch >/dev/null 2>&1; then
      useradd --create-home --home-dir /home/ossresearch --shell /bin/bash \
        --uid 2000 --user-group ossresearch
      passwd --lock ossresearch
    fi
    chmod 0700 /home/ossresearch
    chmod 0750 /home/vmadmin

    # 2) 입력·결과 교환 디렉터리. 입력은 root 소유(조사 사용자는 읽기만),
    #    결과는 조사 사용자 소유. vmadmin 은 sudo 로 넣고 거둔다.
    install -d -o root -g root -m 0755 /srv/oss-research
    install -d -o root -g ossresearch -m 0750 /srv/oss-research/in
    install -d -o ossresearch -g ossresearch -m 0700 /srv/oss-research/out

    # 3) 패키지: nftables(송신 차단), bubblewrap·socat·ripgrep(Linux srt 의존성).
    if ! command -v nft >/dev/null 2>&1 || ! command -v bwrap >/dev/null 2>&1; then
      apt-get update
      apt-get install -y --no-install-recommends nftables bubblewrap socat ripgrep ca-certificates
    fi

    # 3b) 조사 사용자가 root 데몬에게 대신 외부 요청을 시킬 수 있는 경로를 없앤다.
    #     snapd 는 /run/snapd.socket 이 0666 이라 누구나 API 를 부를 수 있다(실측).
    #     unattended-upgrades 는 사용자 경로는 아니지만 버전 고정을 위해 끈다.
    if dpkg-query -W -f='${Status}' snapd 2>/dev/null | grep -q 'install ok'; then
      systemctl disable --now snapd.socket snapd.service snapd.seeded.service || true
      apt-get purge -y snapd lxd-installer
    fi
    systemctl disable --now unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer || true

    # 3c) DNS 를 끊은 뒤에도 sudo 가 자기 호스트 이름을 찾도록 /etc/hosts 에 둔다.
    if ! grep -qw "$(hostname)" /etc/hosts; then
      echo "127.0.1.1 $(hostname)" >>/etc/hosts
    fi

    # 3d) 이전 run 의 egress pin hosts 블록은 부팅마다 지운다(nft 집합도 비어 시작한다).
    sed -i '/^# BEGIN oss-research-egress-pin/,/^# END oss-research-egress-pin/d' /etc/hosts

    # 4) 조사 사용자 송신 차단. 자기 테이블만 다시 만든다(flush ruleset 금지:
    #    Lima 가 넣는 DNS 전달 규칙을 지우지 않기 위해 nftables.service 는 쓰지 않는다).
    install -d -m 0755 /etc/nftables.d
    # systemd-resolved 는 D-Bus·varlink 로 누구의 질의든 대신 보낸다(Ubuntu 실측). 비AI 단계에서는
    # 그 사용자의 송신을 끊어 게스트 전체 DNS 를 막는다. 패키지 설치가 다시 필요하면 잠시 내린다.
    # 이 사용자가 없는 배포판에서는 규칙을 넣지 않는다(없는 이름이면 nft 가 적재를 거부한다).
    RESOLVED_RULE=""
    if id systemd-resolve >/dev/null 2>&1; then
      RESOLVED_RULE='meta skuid "systemd-resolve" counter reject'
    fi
    cat >/etc/nftables.d/oss-research.nft <<EOF
    table inet oss_research
    delete table inet oss_research
    table inet oss_research {
      # run 단위 egress pin(bin/oss-research-egress-pin)이 root 로 채우는 집합.
      # 부팅 때 테이블을 다시 만들므로 항상 비어서 시작한다(재부팅 = 허용 없음).
      set egress4 {
        type ipv4_addr . inet_service
        flags timeout
      }
      chain output {
        type filter hook output priority filter; policy accept;
        # lo 의 systemd-resolved stub(127.0.0.53)이 호스트 DNS로 대신 질의하므로 막는다.
        meta skuid "ossresearch" meta l4proto { tcp, udp } th dport 53 counter reject
        meta skuid "ossresearch" oifname "lo" accept
        meta skuid "ossresearch" meta nfproto ipv4 ip daddr . tcp dport @egress4 counter accept
        meta skuid "ossresearch" counter reject
        ${RESOLVED_RULE}
      }
    }
    EOF
    cat >/etc/systemd/system/oss-research-nft.service <<'EOF'
    [Unit]
    Description=oss-research egress rules
    # 기본 의존성(After=basic.target)과 Before=network-pre.target 이 겹치면 순서 순환이 생기고,
    # systemd 가 cloud-init-network.service 를 지워 Lima 부팅 대기가 끝나지 않았다(Debian 13 재부팅 실측).
    # nftables.service 와 같은 방식으로 기본 의존성을 끄고 필요한 순서만 준다.
    DefaultDependencies=no
    After=local-fs.target systemd-sysusers.service
    Before=network-pre.target shutdown.target
    Wants=network-pre.target
    Conflicts=shutdown.target
    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/usr/sbin/nft -f /etc/nftables.d/oss-research.nft
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable oss-research-nft.service
    # 이미 active 인 oneshot 은 enable --now 로 다시 돌지 않는다. 재실행 때도 규칙을 새로 올린다.
    nft -f /etc/nftables.d/oss-research.nft
